# Vorlage für Panty.com (englischsprachig). Selektoren und Adressen werden mit
#   python -m verkaufsagent einrichten panty
# im Browser angelernt (Ergebnis landet in daten/plattformen/panty.yaml).
#
# Formular: MY OFFERS -> + POST OFFER -> Used Panties -> Formular mit
# Title, Price (Menü mit festen Stufen), Currency, Form, Material, Size,
# Wear duration, Wear occupation, Description, Add photo.
name: panty
anzeigename: Panty.com
basis_url: https://www.panty.com
sprache: en
stil: >-
  Marketplace for worn underwear (adults only), international buyers (mainly US/UK).
  Write in first person like a real seller talking about her favourite piece: personal, playful,
  flirty and sensual – suggestive, never explicit. Describe how the piece looks and feels
  (print, lace, cut, fabric) instead of listing data. Do not repeat size, wear duration or other
  values that are chosen in the form's own fields. Invite special requests and mention discreet
  shipping. The site rewards longer descriptions – write 4–6 natural sentences, max. 2 emojis.
titel_max: 60
beschreibung_max: 2000
standardwerte:
  waehrung: EUR
felder:
  titel:        {typ: text,    pflicht: true,  beschriftung: "Title"}
  preis:        {typ: auswahl, pflicht: true,  beschriftung: "Price (Select price)"}
  waehrung:     {typ: auswahl, pflicht: false, beschriftung: "Currency"}
  form:         {typ: auswahl, pflicht: false, beschriftung: "Form (Select form)"}
  material:     {typ: auswahl, pflicht: false, beschriftung: "Material (Select material)"}
  groesse:      {typ: auswahl, pflicht: false, beschriftung: "Size (Select size)"}
  tragedauer:   {typ: auswahl, pflicht: false, beschriftung: "Wear duration (Select duration)"}
  trageanlass:  {typ: auswahl, pflicht: false, beschriftung: "Wear occupation (Select occupation)"}
  beschreibung: {typ: text,    pflicht: true,  beschriftung: "Description"}
  fotos:        {typ: datei,   pflicht: true,  beschriftung: "Add photo / PICTURE"}
