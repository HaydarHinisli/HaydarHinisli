# Kopieren nach produkte.yaml. Fotos: Dateien oder ein Ordner (relativ zu dieser Datei).
# Plattform-Namen: siehe 'python -m verkaufsagent plattformen'.

produkte:
  - id: slip-001
    name: Spitzenslip schwarz
    marke: Hunkemöller
    preis: 25            # wird exakt so eingestellt
    mindestpreis: 20     # optional: darunter nie (sonst gilt Preis - 30 %)
    zustand: getragen    # getragen | neu_mit_etikett | neu | sehr_gut | gut | zufriedenstellend
    groesse: M
    farbe: Schwarz
    material: Spitze / Baumwolle
    notizen: Nichtraucherhaushalt.
    fotos: [fotos/slip-001]
    plattformen: [crazyslip, creamsi]
    versand: true
    # Pro Plattform: Kategorie-Pfad und weitere Formularfelder (Namen wie beim 'einrichten' vergeben)
    crazyslip:
      kategorie: ["Slips"]
      felder:
        tragedauer: "1 Tag"
    creamsi:
      kategorie: ["Slips & Strings"]
      felder:
        tragedauer: "1 Tag"

  - id: bh-002
    name: Push-up BH rot
    preis: 30
    verhandelbar: false  # Festpreis, nie reduzieren
    groesse: 75B
    farbe: Rot
    fotos: [fotos/bh-002]
    plattformen: [creamsi]
    creamsi:
      kategorie: ["BHs"]
