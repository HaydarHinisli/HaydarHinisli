# Deine Produkte. Fotos: Ordner oder einzelne Dateien (relativ zu dieser Datei).
# Werte in Menü-Feldern (Form, Material, Wear duration …) so schreiben, wie sie im Menü
# der Seite stehen – der Anfang genügt (z. B. "M" findet "Medium").

produkte:
  - id: slip-001
    name: Orange lace G-string          # Artikelname (bei panty.com auf Englisch)
    preis: 25                           # wird so eingestellt (bei Preis-Menüs: nächste Stufe darunter)
    mindestpreis: 20                    # optional: darunter nie
    groesse: M
    farbe: Orange
    material: Lace
    notizen: Smoke-free home.           # Fakten, die in die Beschreibung müssen
    # Eigener Text statt automatischer Beschreibung (optional, wird genau so übernommen):
    # beschreibung: |
    #   This little thong is one of my favourites …
    fotos: [fotos/slip-001]
    plattformen: [panty]
    panty:
      felder:
        waehrung: EUR                   # Currency
        form: String                    # Form
        tragedauer: "1 day"             # Wear duration
        trageanlass: Sport              # Wear occupation

  - id: bh-002
    name: Red push-up bra
    preis: 30
    verhandelbar: false                 # Festpreis, nie reduzieren
    groesse: 75B
    farbe: Red
    fotos: [fotos/bh-002]
    plattformen: [panty]
