[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-video-mcp"
version = "0.1.0"
description = "MCP server for browsing and playing a private local video library from local AI assistants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-video-mcp = "local_video_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["local_video_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
