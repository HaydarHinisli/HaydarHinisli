<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>REPLICA — Live Copilot</title>
<style>
:root{--bg:#0c0f14;--panel:#121722;--card:#171d2a;--border:#283246;--text:#f2f5fb;--muted:#9da9bd;--accent:#6f8cff;--good:#4ed6a6;--warn:#ffc66d;--bad:#ff7f8c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.shell{max-width:640px;margin:0 auto;padding:18px 16px 48px}

/* Sprint 3A test-harness pieces (connect form, debug panel) — kept, but no
   longer the visual center of the page. */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=password],input[type=number]{background:#0f141d;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;flex:1;min-width:160px}
.btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:9px 14px;cursor:pointer;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
pre{background:#0f141d;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;font-size:12px;margin:0}
.debug-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kv{background:#0f141d;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:12px}
.kv .k{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.kv .v{margin-top:3px;font-weight:600;word-break:break-all}
.notice{margin-top:10px;font-size:12px;color:var(--muted)}
[hidden]{display:none !important}

/* Seller v1: dezente Statuszeile ganz oben — Verbindungsstatus ist die
   einzige Information hier, keine call_id, keine technischen Begriffe. */
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 2px 2px}
.dot{width:8px;height:8px;border-radius:50%;background:#687187;flex:0 0 auto;transition:background-color .3s ease}
.dot.on{background:var(--good)}
.dot.err{background:var(--bad)}

/* Zentraler Copilot-Bereich: SAG JETZT ist der mit Abstand wichtigste,
   größte, am schnellsten lesbare Text auf der Seite. */
.copilot{padding:38px 6px 8px;text-align:center}
.sag-label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sag{font-size:32px;font-weight:750;line-height:1.28;letter-spacing:-.02em;margin-top:14px;min-height:2.6em;display:flex;align-items:center;justify-content:center;transition:background-color .5s ease,box-shadow .5s ease;border-radius:14px;padding:6px}
.sag.empty{color:var(--muted);font-weight:500;font-size:22px;font-style:normal}
/* Subtiler "neue Suggestion"-Hinweis: kurzes, ruhiges Aufleuchten, kein
   Sprung, keine Bewegung, keine Größenänderung — soll während eines
   laufenden Gesprächs nicht ablenken. */
.sag.flash{background:rgba(111,140,255,.14);box-shadow:0 0 0 1px rgba(111,140,255,.35) inset}

.hint-badge-row{margin-top:16px;min-height:26px}
.badge{display:inline-block;font-size:12.5px;font-weight:650;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:4px 12px}

.phase-label{margin-top:14px;font-size:12.5px;color:var(--muted)}
.phase-label b{color:var(--text);font-weight:600}

/* Vorherige Empfehlung: bewusst deutlich zurückgenommen, kein zweiter
   Blickfang neben SAG JETZT. */
.history{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);text-align:center}
.history-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.history-text{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.4}

/* Debug-Ansicht: natives <details>, standardmäßig zu, ganz unten, optisch
   wie eine Fußzeile — kein Checkbox-Kasten mehr im Vordergrund. */
.debug-toggle{margin-top:34px;border-top:1px solid var(--border);padding-top:12px}
.debug-toggle summary{cursor:pointer;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;user-select:none}
.debug-toggle summary::-webkit-details-marker{color:var(--muted)}
.debug-body{margin-top:12px}

@media(max-width:600px){.debug-grid{grid-template-columns:1fr}.sag{font-size:26px}.sag.empty{font-size:18px}}
</style>
</head>
<body>
<div class="shell">

  <div class="status-line">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Nicht verbunden</span>
  </div>

  <div class="card" id="connectCard">
    <div class="hint">Verbindung</div>
    <div class="row" style="margin-top:8px">
      <input id="callId" type="number" placeholder="call_id" />
      <input id="token" type="password" placeholder="Bearer-Token (JWT)" />
      <button id="connectBtn" class="btn">Verbinden</button>
    </div>
  </div>

  <main class="copilot">
    <div class="sag-label">Sag jetzt</div>
    <div id="sag" class="sag empty">Bereit für den nächsten Hinweis</div>
    <div id="hintBadge" class="hint-badge-row"></div>
    <div id="phaseLabel" class="phase-label"></div>
  </main>

  <section class="history" id="historySection" hidden>
    <div class="history-label">Vorherige Empfehlung</div>
    <div id="historyText" class="history-text"></div>
  </section>

  <details class="debug-toggle" id="debugToggle">
    <summary>Debug-Ansicht</summary>
    <div class="debug-body">
      <div id="debugPanel" class="debug-grid"></div>
      <div id="debugNotice" class="notice"></div>
    </div>
  </details>

</div>

<script>
(function () {
  'use strict';
  var els = {
    callId: document.getElementById('callId'),
    token: document.getElementById('token'),
    connectBtn: document.getElementById('connectBtn'),
    connectCard: document.getElementById('connectCard'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    sag: document.getElementById('sag'),
    hintBadge: document.getElementById('hintBadge'),
    phaseLabel: document.getElementById('phaseLabel'),
    historySection: document.getElementById('historySection'),
    historyText: document.getElementById('historyText'),
    debugPanel: document.getElementById('debugPanel'),
    debugNotice: document.getElementById('debugNotice'),
  };

  var SAG_PLACEHOLDER = 'Bereit für den nächsten Hinweis';

  // Seller v1 (kein neuer Server-Event nötig): Klartext-Übersetzung der
  // vorhandenen conversation_phase-Werte (app/services/sales_brain.py PHASES)
  // — reine Anzeige-Übersetzung, keine neue Logik/kein neuer Zustand.
  var PHASE_LABELS = {
    greeting: 'Begrüßung',
    rapport_smalltalk: 'Smalltalk',
    transition: 'Übergang',
    opening: 'Gesprächseinstieg',
    discovery: 'Discovery',
    pitch: 'Pitch',
    objection: 'Einwandbehandlung',
    negotiation: 'Verhandlung',
    closing: 'Abschluss',
    wrap_up: 'Nachbereitung',
  };
  function phaseLabel(raw) {
    if (!raw) return '';
    return PHASE_LABELS[raw] || raw;
  }

  // Fix (docs/DECISIONS.md ADR-057): a pasted token can easily carry an
  // accidental leading "Bearer " (copied from a curl -H line) or stray
  // whitespace — REST never hits this because FastAPI's HTTPBearer strips it
  // from the Authorization header before the token reaches app code; this WS
  // handshake sends the token as a plain JSON string instead, so nothing
  // strips it unless we do. The server normalizes the same way independently
  // (defense in depth) — this just avoids sending an already-broken token.
  function sanitizeToken(raw) {
    var t = (raw || '').trim();
    if (/^bearer\s+/i.test(t)) t = t.replace(/^bearer\s+/i, '').trim();
    return t;
  }

  // Pre-fill call_id from /live/{call_id} if that's how this page was opened.
  var pathMatch = window.location.pathname.match(/\/live\/(\d+)/);
  if (pathMatch) els.callId.value = pathMatch[1];

  var ws = null;
  var reconnectDelayMs = 500;
  var reconnectTimer = null;
  var lastRenderedSuggestionId = null;
  var previousSuggestionText = null;
  var manualClose = false;
  var currentCallId = null;
  // Fix-Sprint (ADR-051): raw ping/pong round trips, attached to the next
  // Render-ACK so the SERVER can compute a clock-offset/RTT/uncertainty
  // estimate (app/services/clock_sync.py) — not computed client-side, so there
  // is one tested implementation instead of parallel client/server logic.
  var clockSyncSamples = [];
  var pingSeq = 0;
  var PING_COUNT = 5;
  var PING_INTERVAL_MS = 150;

  // Seller v1 state model — deliberately only three states, each backed by an
  // event this page can actually observe today (no invented "Prospect
  // spricht" / "REPLICA analysiert" — the current push payload has no signal
  // for either; see ADR discussion). Kept as one function so the mapping from
  // WS lifecycle -> visible status text lives in exactly one place.
  function setConnectionState(state) {
    if (state === 'ready') {
      els.statusDot.className = 'dot on';
      els.statusText.textContent = 'Bereit';
      els.connectCard.hidden = true;
    } else if (state === 'reconnecting') {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Verbindung unterbrochen — Wiederverbindung läuft …';
    } else if (state === 'disconnected') {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Getrennt';
      els.connectCard.hidden = false;
    } else if (state === 'error') {
      els.statusDot.className = 'dot err';
      els.statusText.textContent = 'Verbindungsfehler';
    } else if (state === 'auth-error') {
      // Fix (docs/DECISIONS.md ADR-057): a policy-close (code 1008 — invalid/
      // expired token, disallowed origin, tenant mismatch) is a permanent
      // condition for the credentials just used; retrying it forever behind
      // "Wiederverbindung läuft" would silently loop and hide that the seller
      // actually needs to fix the pasted call_id/token.
      els.statusDot.className = 'dot err';
      els.statusText.textContent = 'Authentifizierung fehlgeschlagen — bitte Call-ID/Token prüfen und neu verbinden';
      els.connectCard.hidden = false;
    } else {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Nicht verbunden';
    }
  }

  function connect() {
    var callId = els.callId.value.trim();
    var token = sanitizeToken(els.token.value);
    if (!callId || !token) {
      setConnectionState('error');
      els.statusText.textContent = 'call_id und Token erforderlich';
      return;
    }
    currentCallId = callId;
    manualClose = false;
    var proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + window.location.host + '/ws/live/' + encodeURIComponent(callId));

    ws.addEventListener('open', function () {
      reconnectDelayMs = 500;
      ws.send(JSON.stringify({ type: 'auth', token: token }));
      // Fix (ADR-058): do NOT show 'ready' here — the socket being open only
      // means the auth frame was sent, not that the server has validated it
      // yet. A rejected token would otherwise flash 'Bereit' for the brief
      // window before the server's 1008 close arrives. 'ready' is set below,
      // only once the server's explicit auth_ok confirms real success.
      sendClockSyncPings();
    });

    ws.addEventListener('message', function (evt) {
      var receivedAtPerf = performance.now();
      var receivedAtEpoch = Date.now();
      var msg;
      try { msg = JSON.parse(evt.data); } catch (e) { return; }
      if (msg.type === 'auth_ok') {
        setConnectionState('ready');
      } else if (msg.type === 'suggestion' || msg.type === 'sync') {
        setConnectionState('ready');
        handleSuggestion(msg, receivedAtPerf, receivedAtEpoch);
      } else if (msg.type === 'pong') {
        clockSyncSamples.push({
          t1_client_send_ms: msg.t1_client_send_ms,
          t2_server_recv_ms: msg.t2_server_recv_ms,
          t3_server_send_ms: msg.t3_server_send_ms,
          t4_client_recv_ms: Date.now(),
        });
        if (clockSyncSamples.length > 10) clockSyncSamples.shift();
      }
    });

    ws.addEventListener('close', function (event) {
      // Fix (ADR-057): code 1008 is the server's policy-close (invalid/expired
      // token, disallowed origin, wrong-tenant call_id) — reusing the exact
      // same rejected token in an endless reconnect loop can never succeed and
      // previously just looked like "Wiederverbindung läuft" forever while
      // silently spamming the server. Any other close code (network drop,
      // server restart) still auto-reconnects as before.
      if (!manualClose && event && event.code === 1008) {
        setConnectionState('auth-error');
        return;
      }
      setConnectionState(manualClose ? 'disconnected' : 'reconnecting');
      if (!manualClose) scheduleReconnect();
    });

    ws.addEventListener('error', function () {
      setConnectionState('error');
    });
  }

  function sendClockSyncPings() {
    // A handful of ping/pong samples right after connecting (ADR-051) — spaced
    // out rather than fired all at once, so they see slightly different network
    // conditions instead of one burst that could all share the same anomaly.
    for (var i = 0; i < PING_COUNT; i++) {
      (function (delay) {
        setTimeout(function () {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          pingSeq += 1;
          ws.send(JSON.stringify({ type: 'ping', seq: pingSeq, t1_client_send_ms: Date.now() }));
        }, delay);
      })(i * PING_INTERVAL_MS);
    }
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, reconnectDelayMs);
    reconnectDelayMs = Math.min(reconnectDelayMs * 2, 5000);
  }

  function handleSuggestion(payload, receivedAtPerf, receivedAtEpoch) {
    // Dedup guard (requirement: keine doppelte Anzeige derselben Suggestion) —
    // a reconnect's "sync" message may resend the exact suggestion already shown.
    if (payload.suggestion_id != null && payload.suggestion_id === lastRenderedSuggestionId) {
      return;
    }

    // Genau eine vorherige Empfehlung als dezenter Verlauf — nur, wenn schon
    // eine echte (nicht der Platzhalter) angezeigt wurde.
    if (lastRenderedSuggestionId !== null) {
      previousSuggestionText = els.sag.textContent;
      els.historyText.textContent = previousSuggestionText;
      els.historySection.hidden = false;
    }

    lastRenderedSuggestionId = payload.suggestion_id;

    els.sag.textContent = '„' + (payload.suggestion || '') + '“';
    els.sag.classList.remove('empty');

    els.hintBadge.innerHTML = '';
    if (payload.guidance_hint) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = payload.guidance_hint;
      els.hintBadge.appendChild(badge);
    }

    if (payload.conversation_phase) {
      els.phaseLabel.innerHTML = 'Phase: <b>' + escapeHtml(phaseLabel(payload.conversation_phase)) + '</b>';
    } else {
      els.phaseLabel.textContent = '';
    }

    // Kurzes, ruhiges Aufleuchten statt einer auffälligen Animation — kein
    // Sprung, keine Größenänderung, nichts, was während eines laufenden
    // Gesprächs ablenkt.
    els.sag.classList.remove('flash');
    // Reflow erzwingen, damit die Klasse bei aufeinanderfolgenden
    // Suggestions erneut sichtbar angewendet wird.
    void els.sag.offsetWidth;
    els.sag.classList.add('flash');
    setTimeout(function () { els.sag.classList.remove('flash'); }, 900);

    renderDebug(payload);

    // Render-ACK (Sprint 3A requirement 3): measured via requestAnimationFrame
    // AFTER the DOM update above has been committed — a standard, low-overhead
    // approximation for "actually painted" without the added complexity of the
    // Paint Timing API. client_received_* is the moment the WS message arrived
    // (before any DOM work); client_rendered_* is the moment the browser has
    // committed the next frame containing that update.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var renderedAtPerf = performance.now();
        var renderedAtEpoch = Date.now();
        sendRenderAck(payload, receivedAtPerf, receivedAtEpoch, renderedAtPerf, renderedAtEpoch);
      });
    });
  }

  function renderDebug(payload) {
    var d = payload.debug || {};
    var lat = d.latencies_ms || {};
    var rows = [
      ['call_id', currentCallId],
      ['turn_id', payload.turn_id],
      ['Conversation Phase (roh)', payload.conversation_phase],
      ['Event / Trigger', payload.trigger],
      ['Objection', payload.objection_type || '—'],
      ['trace_id', payload.trace_id],
      ['ASR Provider', d.asr_provider],
      ['Synthetisch?', d.is_synthetic === false ? 'nein (real)' : 'ja (simuliert)'],
      ['Audio→ASR final (ms)', fmt(lat.audio_to_final)],
      ['Turn-Detection (ms)', fmt(lat.turn_detection)],
      ['SalesBrain (ms, intern — NICHT RSL)', fmt(lat.salesbrain)],
      ['Suggestion Persist (ms)', fmt(lat.suggestion_persist)],
    ];
    els.debugPanel.innerHTML = '';
    rows.forEach(function (r) {
      var box = document.createElement('div');
      box.className = 'kv';
      box.innerHTML = '<div class="k">' + escapeHtml(r[0]) + '</div><div class="v">' + escapeHtml(String(r[1] == null ? '—' : r[1])) + '</div>';
      els.debugPanel.appendChild(box);
    });
    els.debugNotice.textContent = 'Diese Latenzwerte sind interne Engine-Zeiten (nie als RSL zu verstehen). Eine Wallclock-RSL-Schätzung (wallclock_rsl_estimate_ms) sowie eine robuste serverseitige Obergrenze (server_render_ack_latency_ms) erscheinen erst nach einem echten Render-ACK und sind niemals approximiert.';
  }

  function fmt(v) {
    return typeof v === 'number' ? v.toFixed(1) : '—';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sendRenderAck(payload, receivedPerf, receivedEpoch, renderedPerf, renderedEpoch) {
    if (payload.suggestion_id == null) return;
    fetch('/api/suggestions/' + encodeURIComponent(payload.suggestion_id) + '/render-ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + els.token.value.trim() },
      body: JSON.stringify({
        trace_id: payload.trace_id || null,
        call_id: payload.call_id || null,
        client_received_epoch_ms: receivedEpoch,
        client_rendered_epoch_ms: renderedEpoch,
        client_received_perf_ms: receivedPerf,
        client_rendered_perf_ms: renderedPerf,
        // ADR-051: whatever clock-sync samples have been collected so far —
        // resent on every ACK (harmless: the server just overwrites its
        // stored offset/RTT/uncertainty estimate with the latest computation).
        clock_sync_samples: clockSyncSamples,
      }),
    }).catch(function () { /* best-effort; a missed ACK just leaves the RSL figures null for this turn */ });
  }

  els.connectBtn.addEventListener('click', function () {
    if (ws) { manualClose = true; ws.close(); }
    connect();
  });
})();
</script>
</body>
</html>
