<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>REPLICA — Live Copilot</title>
<style>
:root{--bg:#0c0f14;--panel:#121722;--card:#171d2a;--border:#283246;--text:#f2f5fb;--muted:#9da9bd;--accent:#6f8cff;--good:#4ed6a6;--warn:#ffc66d;--bad:#ff7f8c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.shell{max-width:640px;margin:0 auto;padding:18px 16px 48px}

/* Sprint 3A test-harness pieces (connect form, debug panel) — kept, but no
   longer the visual center of the page. */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=password],input[type=number],input[type=tel]{background:#0f141d;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;flex:1;min-width:160px}
.btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:9px 14px;cursor:pointer;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
pre{background:#0f141d;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;font-size:12px;margin:0}
.debug-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kv{background:#0f141d;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:12px}
.kv .k{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.kv .v{margin-top:3px;font-weight:600;word-break:break-all}
.notice{margin-top:10px;font-size:12px;color:var(--muted)}
[hidden]{display:none !important}

/* Seller v1: dezente Statuszeile ganz oben — Verbindungsstatus ist die
   einzige Information hier, keine call_id, keine technischen Begriffe. */
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 2px 2px}
.dot{width:8px;height:8px;border-radius:50%;background:#687187;flex:0 0 auto;transition:background-color .3s ease}
.dot.on{background:var(--good)}
.dot.err{background:var(--bad)}

/* Zentraler Copilot-Bereich: SAG JETZT ist der mit Abstand wichtigste,
   größte, am schnellsten lesbare Text auf der Seite. */
.copilot{padding:38px 6px 8px;text-align:center}
.sag-label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sag{font-size:32px;font-weight:750;line-height:1.28;letter-spacing:-.02em;margin-top:14px;min-height:2.6em;display:flex;align-items:center;justify-content:center;transition:background-color .5s ease,box-shadow .5s ease;border-radius:14px;padding:6px}
.sag.empty{color:var(--muted);font-weight:500;font-size:22px;font-style:normal}
/* Subtiler "neue Suggestion"-Hinweis: kurzes, ruhiges Aufleuchten, kein
   Sprung, keine Bewegung, keine Größenänderung — soll während eines
   laufenden Gesprächs nicht ablenken. */
.sag.flash{background:rgba(111,140,255,.14);box-shadow:0 0 0 1px rgba(111,140,255,.35) inset}
/* Red-team hardening (docs/DECISIONS.md ADR-063, item 4): a suggestion must
   never look as current/trustworthy once the analysis pipeline behind it is
   known to be disrupted — dimmed, with an explicit label, never silently left
   looking exactly as it did before the failure. */
.sag.stale{opacity:.4}
.stale-badge{display:none;margin-top:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.stale-badge.show{display:block}

.hint-badge-row{margin-top:16px;min-height:26px}
.badge{display:inline-block;font-size:12.5px;font-weight:650;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:4px 12px}

.phase-label{margin-top:14px;font-size:12.5px;color:var(--muted)}
.phase-label b{color:var(--text);font-weight:600}

/* Vorherige Empfehlung: bewusst deutlich zurückgenommen, kein zweiter
   Blickfang neben SAG JETZT. */
.history{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);text-align:center}
.history-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.history-text{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.4}

/* Debug-Ansicht: natives <details>, standardmäßig zu, ganz unten, optisch
   wie eine Fußzeile — kein Checkbox-Kasten mehr im Vordergrund. */
.debug-toggle{margin-top:34px;border-top:1px solid var(--border);padding-top:12px}
.debug-toggle summary{cursor:pointer;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;user-select:none}
.debug-toggle summary::-webkit-details-marker{color:var(--muted)}
.debug-body{margin-top:12px}

/* ADR-060: real-browser-call test tool — deliberately inside the debug view,
   not the calm seller UI above; this is a test harness control, not a
   product feature. */
.voice-test{margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}

/* Preflight checklist: compact chips instead of a stacked plain-text list. */
.preflight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.preflight-chip{display:flex;align-items:baseline;gap:6px;font-size:12px;padding:6px 9px;border-radius:8px;background:#0f141d;border:1px solid var(--border);overflow:hidden}
.preflight-chip.ok{color:var(--muted)}
.preflight-chip.ok .preflight-mark{color:var(--good)}
.preflight-chip.bad{border-color:var(--bad);color:var(--text)}
.preflight-chip.bad .preflight-mark{color:var(--bad)}
.preflight-mark{flex:0 0 auto;font-weight:700}
.preflight-label{flex:0 1 auto;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preflight-value{flex:0 1 auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
@media(max-width:600px){.preflight-grid{grid-template-columns:1fr}}

@media(max-width:600px){.debug-grid{grid-template-columns:1fr}.sag{font-size:26px}.sag.empty{font-size:18px}}
</style>
</head>
<body>
<div class="shell">

  <div class="status-line">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Nicht verbunden</span>
  </div>

  <div class="card" id="connectCard">
    <div class="hint">Verbindung</div>
    <div class="row" style="margin-top:8px">
      <input id="callId" type="number" placeholder="call_id" />
      <input id="token" type="password" placeholder="Bearer-Token (JWT)" />
      <button id="connectBtn" class="btn">Verbinden</button>
    </div>
  </div>

  <main class="copilot">
    <div class="sag-label">Sag jetzt</div>
    <div id="sag" class="sag empty">Bereit für den nächsten Hinweis</div>
    <div id="staleBadge" class="stale-badge">Analyse unterbrochen — diese Empfehlung ist evtl. nicht mehr aktuell</div>
    <div id="hintBadge" class="hint-badge-row"></div>
    <div id="phaseLabel" class="phase-label"></div>
  </main>

  <section class="history" id="historySection" hidden>
    <div class="history-label">Vorherige Empfehlung</div>
    <div id="historyText" class="history-text"></div>
  </section>

  <details class="debug-toggle" id="debugToggle" open>
    <summary>Debug-Ansicht</summary>
    <div class="debug-body">
      <div id="debugPanel" class="debug-grid"></div>
      <div id="debugNotice" class="notice"></div>

      <div class="voice-test" id="voiceTest">
        <div class="hint">Echter Testcall (Twilio Voice SDK, ADR-060)</div>
        <div class="row" style="margin-top:8px">
          <input id="prospectNumber" type="tel" placeholder="+49… (Testperson, wird nicht gespeichert)" autocomplete="off" autocorrect="off" spellcheck="false" />
          <button id="voiceCallBtn" class="btn">Testcall starten</button>
          <button id="voiceHangupBtn" class="btn" hidden>Auflegen</button>
        </div>
        <div id="voiceStatus" class="notice">Noch nicht initialisiert.</div>
        <div id="voicePreflight" class="notice"></div>
      </div>
    </div>
  </details>

</div>

<script src="/static/vendor/twilio-voice-sdk.min.js"></script>
<script>
(function () {
  'use strict';
  var els = {
    callId: document.getElementById('callId'),
    token: document.getElementById('token'),
    connectBtn: document.getElementById('connectBtn'),
    connectCard: document.getElementById('connectCard'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    sag: document.getElementById('sag'),
    staleBadge: document.getElementById('staleBadge'),
    hintBadge: document.getElementById('hintBadge'),
    phaseLabel: document.getElementById('phaseLabel'),
    historySection: document.getElementById('historySection'),
    historyText: document.getElementById('historyText'),
    debugPanel: document.getElementById('debugPanel'),
    debugNotice: document.getElementById('debugNotice'),
    prospectNumber: document.getElementById('prospectNumber'),
    voiceCallBtn: document.getElementById('voiceCallBtn'),
    voiceHangupBtn: document.getElementById('voiceHangupBtn'),
    voiceStatus: document.getElementById('voiceStatus'),
    voicePreflight: document.getElementById('voicePreflight'),
  };

  var SAG_PLACEHOLDER = 'Bereit für den nächsten Hinweis';

  // Seller v1 (kein neuer Server-Event nötig): Klartext-Übersetzung der
  // vorhandenen conversation_phase-Werte (app/services/sales_brain.py PHASES)
  // — reine Anzeige-Übersetzung, keine neue Logik/kein neuer Zustand.
  var PHASE_LABELS = {
    greeting: 'Begrüßung',
    rapport_smalltalk: 'Smalltalk',
    transition: 'Übergang',
    opening: 'Gesprächseinstieg',
    discovery: 'Discovery',
    pitch: 'Pitch',
    objection: 'Einwandbehandlung',
    negotiation: 'Verhandlung',
    closing: 'Abschluss',
    wrap_up: 'Nachbereitung',
  };
  function phaseLabel(raw) {
    if (!raw) return '';
    return PHASE_LABELS[raw] || raw;
  }

  // Fix (docs/DECISIONS.md ADR-057): a pasted token can easily carry an
  // accidental leading "Bearer " (copied from a curl -H line) or stray
  // whitespace — REST never hits this because FastAPI's HTTPBearer strips it
  // from the Authorization header before the token reaches app code; this WS
  // handshake sends the token as a plain JSON string instead, so nothing
  // strips it unless we do. The server normalizes the same way independently
  // (defense in depth) — this just avoids sending an already-broken token.
  function sanitizeToken(raw) {
    var t = (raw || '').trim();
    if (/^bearer\s+/i.test(t)) t = t.replace(/^bearer\s+/i, '').trim();
    return t;
  }

  // Pre-fill call_id from /live/{call_id} if that's how this page was opened.
  var pathMatch = window.location.pathname.match(/\/live\/(\d+)/);
  if (pathMatch) els.callId.value = pathMatch[1];

  // Pre-fill the bearer token if the dashboard (app/static/index.html) just
  // logged in and handed one off via sessionStorage — removes the manual
  // copy-paste-from-curl step that was the main source of expired/stale-token
  // mistakes during real-call testing. Still just pre-fills the field (never
  // auto-connects): the seller/tester clicks "Verbinden" themselves, same as
  // with a manually pasted token.
  try {
    var handedOffToken = sessionStorage.getItem('replica_bearer_token');
    if (handedOffToken) els.token.value = handedOffToken;
  } catch (e) { /* private mode etc. — falls back to manual paste */ }

  var ws = null;
  var reconnectDelayMs = 500;
  var reconnectTimer = null;
  var lastRenderedSuggestionId = null;
  var previousSuggestionText = null;
  var manualClose = false;
  var currentCallId = null;
  // Fix-Sprint (ADR-051): raw ping/pong round trips, attached to the next
  // Render-ACK so the SERVER can compute a clock-offset/RTT/uncertainty
  // estimate (app/services/clock_sync.py) — not computed client-side, so there
  // is one tested implementation instead of parallel client/server logic.
  var clockSyncSamples = [];
  var pingSeq = 0;
  var PING_COUNT = 5;
  var PING_INTERVAL_MS = 150;

  // Seller v1 state model — deliberately only three states, each backed by an
  // event this page can actually observe today (no invented "Prospect
  // spricht" / "REPLICA analysiert" — the current push payload has no signal
  // for either; see ADR discussion). Kept as one function so the mapping from
  // WS lifecycle -> visible status text lives in exactly one place.
  function setConnectionState(state) {
    if (state === 'ready') {
      els.statusDot.className = 'dot on';
      els.statusText.textContent = 'Bereit';
      els.connectCard.hidden = true;
    } else if (state === 'reconnecting') {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Verbindung unterbrochen — Wiederverbindung läuft …';
    } else if (state === 'disconnected') {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Getrennt';
      els.connectCard.hidden = false;
    } else if (state === 'error') {
      els.statusDot.className = 'dot err';
      els.statusText.textContent = 'Verbindungsfehler';
    } else if (state === 'auth-error') {
      // Fix (docs/DECISIONS.md ADR-057): a policy-close (code 1008 — invalid/
      // expired token, disallowed origin, tenant mismatch) is a permanent
      // condition for the credentials just used; retrying it forever behind
      // "Wiederverbindung läuft" would silently loop and hide that the seller
      // actually needs to fix the pasted call_id/token.
      els.statusDot.className = 'dot err';
      els.statusText.textContent = 'Authentifizierung fehlgeschlagen — bitte Call-ID/Token prüfen und neu verbinden';
      els.connectCard.hidden = false;
    } else {
      els.statusDot.className = 'dot';
      els.statusText.textContent = 'Nicht verbunden';
    }
  }

  function connect() {
    var callId = els.callId.value.trim();
    var token = sanitizeToken(els.token.value);
    if (!callId || !token) {
      setConnectionState('error');
      els.statusText.textContent = 'call_id und Token erforderlich';
      return;
    }
    currentCallId = callId;
    manualClose = false;
    var proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + window.location.host + '/ws/live/' + encodeURIComponent(callId));

    ws.addEventListener('open', function () {
      reconnectDelayMs = 500;
      ws.send(JSON.stringify({ type: 'auth', token: token }));
      // Fix (ADR-058): do NOT show 'ready' here — the socket being open only
      // means the auth frame was sent, not that the server has validated it
      // yet. A rejected token would otherwise flash 'Bereit' for the brief
      // window before the server's 1008 close arrives. 'ready' is set below,
      // only once the server's explicit auth_ok confirms real success.
      sendClockSyncPings();
    });

    ws.addEventListener('message', function (evt) {
      var receivedAtPerf = performance.now();
      var receivedAtEpoch = Date.now();
      var msg;
      try { msg = JSON.parse(evt.data); } catch (e) { return; }
      if (msg.type === 'auth_ok') {
        setConnectionState('ready');
        // ADR-062: show real-call readiness proactively, not only when the
        // operator clicks "Testcall starten" — reuses the same bearer token
        // already used to authenticate the main WS connection.
        refreshVoicePreflight(sanitizeToken(els.token.value)).catch(function (e) {
          els.voicePreflight.textContent = e && e.message ? e.message : 'Preflight-Check fehlgeschlagen.';
        });
      } else if (msg.type === 'suggestion' || msg.type === 'sync') {
        setConnectionState('ready');
        handleSuggestion(msg, receivedAtPerf, receivedAtEpoch);
      } else if (msg.type === 'pipeline_status') {
        // Red-team hardening (docs/DECISIONS.md ADR-063, item 3): pushed
        // independently of the Twilio call's own state — see setAnalysisState().
        setAnalysisState(msg.status, msg.detail);
      } else if (msg.type === 'suggestion_stale') {
        // item 4: an already-shown suggestion is no longer backed by a
        // confirmed-working analysis — mark it, never retract it silently.
        setSuggestionStale(true);
      } else if (msg.type === 'pong') {
        clockSyncSamples.push({
          t1_client_send_ms: msg.t1_client_send_ms,
          t2_server_recv_ms: msg.t2_server_recv_ms,
          t3_server_send_ms: msg.t3_server_send_ms,
          t4_client_recv_ms: Date.now(),
        });
        if (clockSyncSamples.length > 10) clockSyncSamples.shift();
      }
    });

    ws.addEventListener('close', function (event) {
      // Fix (ADR-057): code 1008 is the server's policy-close (invalid/expired
      // token, disallowed origin, wrong-tenant call_id) — reusing the exact
      // same rejected token in an endless reconnect loop can never succeed and
      // previously just looked like "Wiederverbindung läuft" forever while
      // silently spamming the server. Any other close code (network drop,
      // server restart) still auto-reconnects as before.
      if (!manualClose && event && event.code === 1008) {
        setConnectionState('auth-error');
        return;
      }
      setConnectionState(manualClose ? 'disconnected' : 'reconnecting');
      if (!manualClose) scheduleReconnect();
    });

    ws.addEventListener('error', function () {
      setConnectionState('error');
    });
  }

  function sendClockSyncPings() {
    // A handful of ping/pong samples right after connecting (ADR-051) — spaced
    // out rather than fired all at once, so they see slightly different network
    // conditions instead of one burst that could all share the same anomaly.
    for (var i = 0; i < PING_COUNT; i++) {
      (function (delay) {
        setTimeout(function () {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          pingSeq += 1;
          ws.send(JSON.stringify({ type: 'ping', seq: pingSeq, t1_client_send_ms: Date.now() }));
        }, delay);
      })(i * PING_INTERVAL_MS);
    }
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, reconnectDelayMs);
    reconnectDelayMs = Math.min(reconnectDelayMs * 2, 5000);
  }

  function handleSuggestion(payload, receivedAtPerf, receivedAtEpoch) {
    // Dedup guard (requirement: keine doppelte Anzeige derselben Suggestion) —
    // a reconnect's "sync" message may resend the exact suggestion already shown.
    if (payload.suggestion_id != null && payload.suggestion_id === lastRenderedSuggestionId) {
      return;
    }

    // item 4: a genuinely new suggestion is, by construction, backed by an
    // analysis pipeline that just ran successfully end-to-end — clears any
    // earlier staleness mark. `payload.stale` (set on the `sync`-on-reconnect
    // resend, ADR-063) still overrides this below if the hub itself recorded
    // this exact payload as stale.
    setSuggestionStale(!!payload.stale);

    // Genau eine vorherige Empfehlung als dezenter Verlauf — nur, wenn schon
    // eine echte (nicht der Platzhalter) angezeigt wurde.
    if (lastRenderedSuggestionId !== null) {
      previousSuggestionText = els.sag.textContent;
      els.historyText.textContent = previousSuggestionText;
      els.historySection.hidden = false;
    }

    lastRenderedSuggestionId = payload.suggestion_id;

    els.sag.textContent = '„' + (payload.suggestion || '') + '“';
    els.sag.classList.remove('empty');

    els.hintBadge.innerHTML = '';
    if (payload.guidance_hint) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = payload.guidance_hint;
      els.hintBadge.appendChild(badge);
    }

    if (payload.conversation_phase) {
      els.phaseLabel.innerHTML = 'Phase: <b>' + escapeHtml(phaseLabel(payload.conversation_phase)) + '</b>';
    } else {
      els.phaseLabel.textContent = '';
    }

    // Kurzes, ruhiges Aufleuchten statt einer auffälligen Animation — kein
    // Sprung, keine Größenänderung, nichts, was während eines laufenden
    // Gesprächs ablenkt.
    els.sag.classList.remove('flash');
    // Reflow erzwingen, damit die Klasse bei aufeinanderfolgenden
    // Suggestions erneut sichtbar angewendet wird.
    void els.sag.offsetWidth;
    els.sag.classList.add('flash');
    setTimeout(function () { els.sag.classList.remove('flash'); }, 900);

    renderDebug(payload);

    // Render-ACK (Sprint 3A requirement 3): measured via requestAnimationFrame
    // AFTER the DOM update above has been committed — a standard, low-overhead
    // approximation for "actually painted" without the added complexity of the
    // Paint Timing API. client_received_* is the moment the WS message arrived
    // (before any DOM work); client_rendered_* is the moment the browser has
    // committed the next frame containing that update.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var renderedAtPerf = performance.now();
        var renderedAtEpoch = Date.now();
        sendRenderAck(payload, receivedAtPerf, receivedAtEpoch, renderedAtPerf, renderedAtEpoch);
      });
    });
  }

  function renderDebug(payload) {
    var d = payload.debug || {};
    var lat = d.latencies_ms || {};
    var rows = [
      ['call_id', currentCallId],
      ['turn_id', payload.turn_id],
      ['Conversation Phase (roh)', payload.conversation_phase],
      ['Event / Trigger', payload.trigger],
      ['Objection', payload.objection_type || '—'],
      ['trace_id', payload.trace_id],
      ['ASR Provider', d.asr_provider],
      ['Synthetisch?', d.is_synthetic === false ? 'nein (real)' : 'ja (simuliert)'],
      ['Audio→ASR final (ms)', fmt(lat.audio_to_final)],
      ['Turn-Detection (ms)', fmt(lat.turn_detection)],
      ['SalesBrain (ms, intern — NICHT RSL)', fmt(lat.salesbrain)],
      ['Suggestion Persist (ms)', fmt(lat.suggestion_persist)],
    ];
    els.debugPanel.innerHTML = '';
    rows.forEach(function (r) {
      var box = document.createElement('div');
      box.className = 'kv';
      box.innerHTML = '<div class="k">' + escapeHtml(r[0]) + '</div><div class="v">' + escapeHtml(String(r[1] == null ? '—' : r[1])) + '</div>';
      els.debugPanel.appendChild(box);
    });
    els.debugNotice.textContent = 'Diese Latenzwerte sind interne Engine-Zeiten (nie als RSL zu verstehen). Eine Wallclock-RSL-Schätzung (wallclock_rsl_estimate_ms) sowie eine robuste serverseitige Obergrenze (server_render_ack_latency_ms) erscheinen erst nach einem echten Render-ACK und sind niemals approximiert.';
  }

  function fmt(v) {
    return typeof v === 'number' ? v.toFixed(1) : '—';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sendRenderAck(payload, receivedPerf, receivedEpoch, renderedPerf, renderedEpoch) {
    if (payload.suggestion_id == null) return;
    fetch('/api/suggestions/' + encodeURIComponent(payload.suggestion_id) + '/render-ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + els.token.value.trim() },
      body: JSON.stringify({
        trace_id: payload.trace_id || null,
        call_id: payload.call_id || null,
        client_received_epoch_ms: receivedEpoch,
        client_rendered_epoch_ms: renderedEpoch,
        client_received_perf_ms: receivedPerf,
        client_rendered_perf_ms: renderedPerf,
        // ADR-051: whatever clock-sync samples have been collected so far —
        // resent on every ACK (harmless: the server just overwrites its
        // stored offset/RTT/uncertainty estimate with the latest computation).
        clock_sync_samples: clockSyncSamples,
      }),
    }).catch(function () { /* best-effort; a missed ACK just leaves the RSL figures null for this turn */ });
  }

  els.connectBtn.addEventListener('click', function () {
    if (ws) { manualClose = true; ws.close(); }
    connect();
  });

  // --- ADR-060: real browser-originated test call (Twilio Voice JS SDK) ------
  // Deliberately confined to the debug view — this drives one real call for
  // the first real-provider test, it is not a seller-facing dialer feature.
  var voiceDevice = null;
  var activeCall = null;
  var E164_RE = /^\+[1-9]\d{6,14}$/;

  function setSuggestionStale(stale) {
    els.sag.classList.toggle('stale', !!stale);
    els.staleBadge.classList.toggle('show', !!stale);
  }

  // Red-team hardening (docs/DECISIONS.md ADR-063, item 2): the TELEPHONY call
  // state, observed exclusively from real Twilio Device/Call SDK events below —
  // never assumed/optimistically set. Distinct on purpose from `analysisState`
  // (item 3): a connected phone call proves nothing about whether REPLICA's own
  // pipeline is actually working.
  var callState = 'ready'; // ready|connecting|ringing|connected|ending|ended|failed
  var lastCallError = null;
  var CALL_STATE_LABELS = {
    ready: 'Bereit für Testcall.',
    connecting: 'Verbinde …',
    ringing: 'Klingelt …',
    connected: 'Im Gespräch.',
    ending: 'Wird beendet …',
    ended: 'Call beendet.',
    failed: 'Call fehlgeschlagen.',
  };

  // item 3: the analysis/pipeline state, driven ONLY by `pipeline_status`
  // pushes from the server (app/streaming/pipeline.PipelineStatus) — never
  // inferred client-side from the call state.
  var analysisState = 'waiting';
  var analysisDetail = null;
  var ANALYSIS_STATE_LABELS = {
    waiting: 'Media Stream wartet',
    media_stream_connected: 'Media Stream verbunden',
    deepgram_connecting: 'Deepgram verbindet',
    deepgram_ready: 'Deepgram bereit',
    audio_received: 'Audio wird empfangen',
    transcript_active: 'Transcript aktiv',
    suggestion_pipeline_ready: 'Suggestion-Pipeline bereit',
    disrupted: 'Analyse nicht verfügbar',
  };
  var ANALYSIS_DISRUPTION_DETAIL_LABELS = {
    deepgram_unavailable: 'Deepgram nicht verfügbar',
    media_stream_disconnected: 'Media Stream getrennt',
    untrusted_speaker_mapping: 'Speaker-Mapping unsicher',
    pipeline_error: 'Analyse nicht verfügbar',
  };

  function analysisLabel() {
    if (analysisState === 'disrupted') {
      return (analysisDetail && ANALYSIS_DISRUPTION_DETAIL_LABELS[analysisDetail]) || ANALYSIS_STATE_LABELS.disrupted;
    }
    return ANALYSIS_STATE_LABELS[analysisState] || analysisState;
  }

  // The one place callState/analysisState are combined into visible text and
  // into the call/hangup buttons' enabled state (item 1: double-start
  // prevention lives here, not scattered across every place that could change
  // callState) — the requirement that the seller can never mistake "call
  // connected" for "REPLICA is analyzing" is met by ALWAYS showing the
  // analysis state alongside "Call verbunden", never the call state alone,
  // whenever a call is actually connected/ending.
  function renderVoiceStatus() {
    if (callState === 'connected' || callState === 'ending') {
      setVoiceStatusText('Call verbunden – ' + analysisLabel());
    } else {
      var suffix = lastCallError ? ' (' + lastCallError + ')' : '';
      setVoiceStatusText((CALL_STATE_LABELS[callState] || callState) + suffix);
    }
    // Item 1: a second call can only ever start from ready/ended/failed — no
    // other code path re-enables this button, so connecting/ringing/connected/
    // ending all stay hard-blocked regardless of how many times the (disabled)
    // button is clicked or Enter is pressed on the number field.
    var canStartNewCall = (callState === 'ready' || callState === 'ended' || callState === 'failed');
    els.voiceCallBtn.disabled = !canStartNewCall;
    els.voiceHangupBtn.hidden = canStartNewCall;
  }

  function setVoiceStatusText(text) {
    els.voiceStatus.textContent = text;
  }

  function setCallState(state, opts) {
    callState = state;
    if (opts && opts.error) lastCallError = opts.error;
    if (state === 'ready' || state === 'connecting') lastCallError = null;
    renderVoiceStatus();
  }

  function setAnalysisState(state, detail) {
    analysisState = state;
    analysisDetail = detail || null;
    renderVoiceStatus();
  }

  // Fix (docs/DECISIONS.md ADR-062): fail closed — a real call must never
  // start with incomplete configuration, and the operator should be able to
  // SEE readiness, not just discover it when a call refuses to start.
  // Renders per-item ✓/✗ by label only — never a secret value; the server
  // itself (`GET /api/voice/preflight`) never returns one either.
  function renderPreflight(checks) {
    els.voicePreflight.innerHTML = '<div class="preflight-grid">' + checks.map(function (c) {
      var extra = c.value ? escapeHtml(c.value) : (c.detail ? escapeHtml(c.detail) : '');
      return '<div class="preflight-chip ' + (c.ok ? 'ok' : 'bad') + '">'
        + '<span class="preflight-mark">' + (c.ok ? '✓' : '✗') + '</span>'
        + '<span class="preflight-label">' + escapeHtml(c.label) + '</span>'
        + (extra ? '<span class="preflight-value">' + extra + '</span>' : '')
        + '</div>';
    }).join('') + '</div>';
  }

  async function refreshVoicePreflight(bearer) {
    var resp = await fetch('/api/voice/preflight', { headers: { Authorization: 'Bearer ' + bearer } });
    if (!resp.ok) {
      throw new Error('Preflight-Check fehlgeschlagen (HTTP ' + resp.status + ').');
    }
    var preflight = await resp.json();
    renderPreflight(preflight.checks);
    return preflight;
  }

  // Red-team hardening (docs/DECISIONS.md ADR-063, item 7/8): call_id is now
  // REQUIRED (the server rejects a request without it, and independently
  // verifies tenant ownership + consent/policy for it before minting
  // anything) and the response now also carries `voice_ticket` — a short-lived,
  // REPLICA-signed artifact binding exactly this call/tenant/user, which
  // `device.connect()` sends INSTEAD of a raw call_id (see the click handler
  // below). Fetched fresh on every attempt (never cached like the Device
  // registration token below) — a ticket is meant to authorize exactly one
  // upcoming call placement, not be reused indefinitely.
  async function fetchVoiceAccessToken(bearer) {
    var resp = await fetch('/api/voice/access-token?call_id=' + encodeURIComponent(currentCallId), {
      method: 'POST', headers: { Authorization: 'Bearer ' + bearer },
    });
    if (!resp.ok) {
      var detail = '';
      try {
        var errBody = await resp.json();
        var msg = errBody && errBody.detail && errBody.detail.message;
        if (msg) detail = ': ' + msg;
      } catch (e) { /* non-JSON error body — ignore, HTTP status alone still shown */ }
      throw new Error('Access-Token-Anfrage fehlgeschlagen (HTTP ' + resp.status + ')' + detail + '.');
    }
    return resp.json();
  }

  async function ensureVoiceDevice(tokenBody) {
    // Fix: the Access Token has a finite TTL (1h, see /api/voice/access-token's
    // ttl_seconds) — a Device created once and then reused indefinitely for every
    // later connect() would silently keep using that first, eventually-expired
    // token, causing every call placed after expiry to fail immediately client-
    // side (no ringing, no Twilio Call record at all) instead of placing a real
    // call. Every attempt fetches a fresh token (fetchVoiceAccessToken(), called
    // right before this), so an existing Device must be updated with it, not
    // just returned as-is.
    if (voiceDevice) {
      voiceDevice.updateToken(tokenBody.token);
      return voiceDevice;
    }
    if (typeof Twilio === 'undefined' || !Twilio.Device) {
      throw new Error('Twilio Voice SDK nicht geladen (app/static/vendor/twilio-voice-sdk.min.js fehlt?).');
    }
    // Fix (docs/DECISIONS.md ADR-061): edge must be set explicitly — the
    // Voice SDK's own default is 'roaming' (nearest-latency auto-selection),
    // not necessarily the EU edge this account is pinned to everywhere else
    // (TWILIO_EDGE). Read from the token response rather than hardcoded here,
    // so this file can never drift out of sync with the server's own config.
    voiceDevice = new Twilio.Device(tokenBody.token, { edge: tokenBody.edge });
    voiceDevice.on('error', function (err) {
      setCallState('failed', { error: err && err.message ? err.message : 'unbekannt' });
    });
    return voiceDevice;
  }

  // Red-team hardening (docs/DECISIONS.md ADR-063, item 5): a real Voice SDK
  // call disconnected the same, explicit way regardless of who/what ended it —
  // used both by the Hangup button below and, implicitly, whenever the call
  // object itself reports it is already gone (disconnect/cancel/reject/error
  // all converge on the SAME state transition, never a separate one each).
  function onCallEnded(state, opts) {
    activeCall = null;
    setCallState(state, opts);
  }

  els.voiceHangupBtn.addEventListener('click', function () {
    // item 5: disconnects the CURRENT Twilio call, if any, and otherwise does
    // nothing — the actual state transition to 'ended' only ever happens from
    // the real call.on('disconnect') handler below (item 2: state comes from
    // the SDK, never assumed here), this just requests it. 'ending' is shown
    // immediately as honest feedback that a hangup was requested, not as a
    // claim that the call has actually ended yet.
    if (activeCall) {
      setCallState('ending');
      try { activeCall.disconnect(); } catch (e) { /* already gone */ }
    }
  });

  // item 1: double-start / double-call prevention. This function is the ONLY
  // path that can ever start a real call, and its very first statement is the
  // state guard — before reading the prospect number, before clearing it,
  // before any async work. Both a second physical click on the button AND
  // Enter on the number field (wired below to invoke this same handler) go
  // through this identical guard; the button itself is also kept `disabled`
  // for the whole connecting/ringing/connected/ending duration
  // (renderVoiceStatus()) as a second, independent layer — a disabled button
  // never dispatches a click event at all, so even a very fast double-click
  // cannot reach this function a second time while a call is in flight.
  async function startVoiceTestCall() {
    if (callState !== 'ready' && callState !== 'ended' && callState !== 'failed') return;
    setCallState('connecting');
    setAnalysisState('waiting');
    setSuggestionStale(false);

    // Read once, then clear the field IMMEDIATELY — before any further check,
    // so it never lingers in the DOM one tick longer than necessary no matter
    // which validation below fails or succeeds (docs/DECISIONS.md
    // ADR-059/060/062). The value is only ever used further down if every
    // check up to that point actually passes.
    var prospectNumber = els.prospectNumber.value.trim();
    els.prospectNumber.value = '';

    if (!currentCallId) {
      setCallState('failed', { error: 'Erst oben mit Call-ID/Token verbinden.' });
      return;
    }
    var bearer = sanitizeToken(els.token.value);
    if (!bearer) {
      setCallState('failed', { error: 'Kein Bearer-Token — oben zuerst verbinden.' });
      return;
    }

    try {
      // Fail closed (ADR-062): checked before ever fetching an Access Token
      // or touching device.connect().
      var preflight = await refreshVoicePreflight(bearer);
      if (!preflight.ready) {
        var missing = preflight.checks.filter(function (c) { return !c.ok; }).map(function (c) { return c.label; });
        setCallState('failed', { error: 'Konfiguration unvollständig — fehlt: ' + missing.join(', ') });
        return;
      }
    } catch (e) {
      setCallState('failed', { error: e && e.message ? e.message : 'Preflight-Check fehlgeschlagen.' });
      return;
    }
    if (!E164_RE.test(prospectNumber)) {
      setCallState('failed', { error: 'Ungültiges Format — bitte E.164 verwenden (z. B. +49…).' });
      return;
    }

    try {
      var tokenBody = await fetchVoiceAccessToken(bearer);
      var device = await ensureVoiceDevice(tokenBody);
      // item 7/8: `replica_voice_ticket`, never a raw call_id — see
      // fetchVoiceAccessToken()'s comment and docs/DECISIONS.md ADR-063.
      var call = await device.connect({ params: { To: prospectNumber, replica_voice_ticket: tokenBody.voice_ticket } });
      activeCall = call;
      // item 2: every state transition below comes from a real Twilio Call
      // SDK event — never assumed/set optimistically from this code's own
      // control flow.
      call.on('ringing', function () { setCallState('ringing'); });
      call.on('accept', function () { setCallState('connected'); });
      call.on('disconnect', function () { onCallEnded('ended'); });
      call.on('cancel', function () { onCallEnded('ended'); });
      call.on('reject', function () { onCallEnded('ended'); });
      call.on('error', function (err) {
        onCallEnded('failed', { error: err && err.message ? err.message : 'unbekannt' });
      });
    } catch (e) {
      activeCall = null;
      setCallState('failed', { error: e && e.message ? e.message : 'Testcall konnte nicht gestartet werden.' });
    }
    // prospectNumber deliberately never appears in any log/console statement above.
  }

  els.voiceCallBtn.addEventListener('click', startVoiceTestCall);
  // item 1: Enter in the number field must not bypass the same guard/button —
  // routed through the identical handler rather than a second, parallel
  // "start a call" code path that could drift out of sync with it.
  els.prospectNumber.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      startVoiceTestCall();
    }
  });
})();
</script>
</body>
</html>
