services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPLICA_DATABASE_URL: postgresql+psycopg://replica:replica@postgres:5432/replica
      REPLICA_DEMO_MODE: "true"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replica
      POSTGRES_PASSWORD: replica
      POSTGRES_DB: replica
    volumes:
      - replica_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
volumes:
  replica_pg:
